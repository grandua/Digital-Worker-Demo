<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorten it</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;padding:clamp(24px,5vw,48px);border-radius:24px;box-shadow:0 18px 60px #24345a18}h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.06em}p{color:#68748b;margin:0 0 28px}.form{display:flex;gap:10px}.form input{flex:1;min-width:0;border:1px solid #d8deea;border-radius:12px;padding:14px 16px;font-size:1rem;outline:none}.form input:focus{border-color:#6575ff;box-shadow:0 0 0 4px #6575ff20}.form button{border:0;border-radius:12px;padding:0 20px;background:#5365ed;color:white;font-weight:700;cursor:pointer}.form button:hover{background:#4052d8}.error{color:#bd3347;min-height:24px;margin:12px 0}.links{display:grid;gap:12px}.empty{text-align:center;padding:30px;color:#8b95a8}.link{border:1px solid #e4e8f0;border-radius:14px;padding:16px}.link a{color:#4156db;font-weight:700;text-decoration:none;overflow-wrap:anywhere}.original{font-size:.9rem;color:#6f7b91;overflow-wrap:anywhere;margin-top:5px}.badge{float:right;background:#edf0ff;color:#4156db;border-radius:99px;padding:3px 9px;font-size:.78rem}
</style></head><body><main class="card"><h1>Make a shorter link.</h1><p>Paste a long URL and get a clean link to share.</p><form class="form" id="form"><input id="url" type="url" placeholder="https://example.com/your-long-url" required><button>Shorten</button></form><div class="error" id="error" role="alert"></div><section class="links" id="links"><div class="empty">Your links will appear here.</div></section></main>
<script>
const CREATED=201,RATE_LIMITED=429,form=document.querySelector('#form'),input=document.querySelector('#url'),error=document.querySelector('#error'),list=document.querySelector('#links');
 function render(items){list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Your links will appear here.';list.append(empty);return}items.forEach(x=>{const article=document.createElement('article');article.className='link';const badge=document.createElement('span');badge.className='badge';badge.textContent=`${x.clickCount} clicks`;const anchor=document.createElement('a');anchor.href=x.shortUrl;anchor.textContent=x.shortUrl;const original=document.createElement('div');original.className='original';original.textContent=x.originalUrl;article.append(badge,anchor,original);list.append(article)})}
 function showError(message){error.textContent=message}
 function clearForm(){input.value='';showError('')}
 async function loadLinks(){try{const r=await fetch('/api/links');if(!r.ok)throw new Error('List request failed');render(await r.json());showError('')}catch{showError('Unable to load your links.')}}
 async function createLink(){showError('');try{const r=await fetch('/api/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:input.value})});if(r.status===CREATED){clearForm();await loadLinks()}else if(r.status===RATE_LIMITED)showError('Too many requests. Please try again shortly.');else showError('Please enter a valid HTTP or HTTPS URL.')}catch{showError('Unable to create your link.')}}
 form.addEventListener('submit',e=>{e.preventDefault();createLink()});loadLinks();
</script></body></html>
